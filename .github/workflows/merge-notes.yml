# Merge notes that AI pushed to claude/, ccr- or codex/ branches into main
name: Merge notes into main

on:
  push:
    branches:
      - "claude/**" # Claude Code
      - "ccr-**"    # Claude Code (session)
      - "codex/**"  # Codex

permissions:
  contents: write

concurrency:
  group: merge-into-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the pushed branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git merge --no-edit "origin/$BRANCH"
          git push origin main
